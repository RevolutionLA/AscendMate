# 构建 VitePress 站点并部署到 GitHub Pages
name: Deploy VitePress site to Pages

on:
  # 推送到 main / master 分支时触发
  push:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        env:
          # GitHub Pages 项目页以 /<repo-name>/ 部署，据此计算基础路径
          VITE_BASE: /${{ github.event.repository.name }}/
          NPM_CONFIG_FUND: false
        run: npm run docs:build

      - name: Inject GitHub traffic stats into footer
        env:
          # 优先用 PAT(GH_STATS_TOKEN, repo权限) 读 traffic; 否则显示 –, 不阻断部署
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # traffic 接口需 PAT; gh api 返回错误 JSON 或为空时就回退为 – (数字/– 不破坏 sed)
          VIEWS=$(v=$(gh api "repos/$REPO/traffic/views" --jq ".count" 2>/dev/null || true); case "$v" in ""|*[!0-9]*) echo "–";; *) echo "$v";; esac)
          UV=$(v=$(gh api "repos/$REPO/traffic/views" --jq ".uniques" 2>/dev/null || true); case "$v" in ""|*[!0-9]*) echo "–";; *) echo "$v";; esac)
          CLONES=$(v=$(gh api "repos/$REPO/traffic/clones" --jq ".count" 2>/dev/null || true); case "$v" in ""|*[!0-9]*) echo "–";; *) echo "$v";; esac)
          echo "views=$VIEWS uv=$UV clones=$CLONES"
          # 用 # 作 sed 分隔符, 值和占位符不含 # , 避免冲突
          P="${{ github.workspace }}/docs/.vitepress/dist"
          find "$P" -name '*.html' -print0 | xargs -0 -I% sed -i "s#__VIEWS__#$VIEWS#g; s#__UV__#$UV#g; s#__CLONES__#$CLONES#g" %

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
