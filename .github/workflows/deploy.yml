# 构建 VitePress 站点并部署到 GitHub Pages
name: Deploy VitePress site to Pages

on:
  # 推送到 main / master 分支时触发
  push:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        env:
          # GitHub Pages 项目页以 /<repo-name>/ 部署，据此计算基础路径
          VITE_BASE: /${{ github.event.repository.name }}/
          NPM_CONFIG_FUND: false
        run: npm run docs:build

      # 附加功能：页脚显示 GitHub traffic 统计。
      # traffic 接口仅对 PAT(GH_STATS_TOKEN, repo 权限) 开放；拿不到就显示 –，
      # 且整个 step 绝不因统计失败而阻断部署。
      - name: Inject GitHub traffic stats into footer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          getnum(){
            api="$1"; key="$2"
            v="$(gh api "$api" --jq ".$key" 2>/dev/null || true)"
            case "$v" in ""|*[!0-9]*) echo "–";; *) echo "$v";; esac
          }
          VIEWS=$(getnum "repos/$REPO/traffic/views" "count")
          UV=$(getnum "repos/$REPO/traffic/views" "uniques")
          CLONES=$(getnum "repos/$REPO/traffic/clones" "count")
          echo "views=$VIEWS uv=$UV clones=$CLONES"
          P="${{ github.workspace }}/docs/.vitepress/dist"
          find "$P" -name '*.html' -print0 \
            | xargs -0 -I% sed -i "s#__VIEWS__#$VIEWS#g; s#__UV__#$UV#g; s#__CLONES__#$CLONES#g" %

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
